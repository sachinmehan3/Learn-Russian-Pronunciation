<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Russian Pronunciation Tutor</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #1a1a1a;
    --bubble-bg: #f0f2f5;
    --accent: #2563eb;
    --border: #d8dde3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181c;
      --fg: #e8eaed;
      --bubble-bg: #24272c;
      --accent: #5b9dff;
      --border: #3a3f46;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    justify-content: center;
  }
  #app {
    width: 100%;
    max-width: 720px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 16px;
  }
  h1 {
    font-size: 1.1rem;
    font-weight: 600;
    margin: 0 0 12px;
  }
  #log {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding-bottom: 12px;
  }
  .msg {
    max-width: 85%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.5;
    word-wrap: break-word;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--accent);
    color: white;
  }
  .msg.teacher {
    align-self: flex-start;
    background: var(--bubble-bg);
  }
  .clips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 8px;
  }
  .word-btn {
    font: inherit;
    color: var(--accent);
    background: none;
    border: 1px solid var(--accent);
    border-radius: 999px;
    padding: 2px 10px;
    cursor: pointer;
  }
  .word-btn:hover {
    opacity: 0.75;
  }
  .word-btn.failed {
    color: #e04b4b;
    border-bottom-color: #e04b4b;
  }
  form {
    display: flex;
    gap: 8px;
  }
  #debug {
    margin-top: 10px;
    border-top: 1px solid var(--border);
    padding-top: 8px;
  }
  #debug summary {
    cursor: pointer;
    font-size: 0.85rem;
    color: var(--fg);
    opacity: 0.7;
  }
  #debug-log {
    margin: 8px 0 0;
    max-height: 200px;
    overflow-y: auto;
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    font-size: 0.78rem;
    background: var(--bubble-bg);
    border-radius: 8px;
    padding: 8px;
    white-space: pre-wrap;
    word-break: break-all;
  }
  #debug-log .err { color: #e04b4b; }
  #debug-log .ok { color: #3aa76d; }
  input[type="text"] {
    flex: 1;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--fg);
    font-size: 1rem;
  }
  button[type="submit"] {
    padding: 10px 16px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: white;
    font-size: 1rem;
    cursor: pointer;
  }
</style>
</head>
<body>
<div id="app">
  <h1>Russian Pronunciation Tutor</h1>
  <div id="log"></div>
  <form id="form">
    <input id="input" type="text" placeholder="Ask anything..." autocomplete="off" autofocus>
    <button type="submit">Send</button>
  </form>
  <details id="debug">
    <summary>Debug log</summary>
    <div id="debug-log"></div>
  </details>
</div>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");
const debugLog = document.getElementById("debug-log");

function debug(msg, level = "info") {
  const time = new Date().toLocaleTimeString();
  const line = document.createElement("div");
  if (level !== "info") line.className = level;
  line.textContent = `[${time}] ${msg}`;
  debugLog.appendChild(line);
  debugLog.scrollTop = debugLog.scrollHeight;
  (level === "err" ? console.error : console.log)(msg);
}

window.addEventListener("error", (e) => debug("Uncaught error: " + e.message, "err"));
window.addEventListener("unhandledrejection", (e) => debug("Unhandled rejection: " + e.reason, "err"));

function addMessage(role, node) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.appendChild(node);
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  return div;
}

async function playClip(clipId, btn) {
  debug(`Clicked word -> clip_id "${clipId}"`);
  try {
    const res = await fetch("/audio/" + clipId);
    debug(`GET /audio/${clipId} -> ${res.status} ${res.statusText}`, res.ok ? "ok" : "err");
    if (!res.ok) {
      btn.classList.add("failed");
      btn.title = `Playback failed: HTTP ${res.status} (${res.statusText})`;
      return;
    }
    const blob = await res.blob();
    debug(`Received ${blob.size} bytes, type=${blob.type}`);
    const url = URL.createObjectURL(blob);
    const audio = new Audio(url);
    audio.addEventListener("ended", () => URL.revokeObjectURL(url));
    await audio.play();
    debug(`Playing clip_id "${clipId}"`, "ok");
    btn.classList.remove("failed");
    btn.title = "";
  } catch (err) {
    debug(`Error playing clip_id "${clipId}": ${err}`, "err");
    btn.classList.add("failed");
    btn.title = "Playback failed: " + err;
  }
}

function renderReply(reply) {
  const frag = document.createDocumentFragment();
  frag.appendChild(document.createTextNode(reply.text));

  if (reply.clips.length > 0) {
    const row = document.createElement("div");
    row.className = "clips";
    for (const clip of reply.clips) {
      debug(`Rendering clip "${clip.text}" -> clip_id "${clip.clip_id}"`);
      const btn = document.createElement("button");
      btn.className = "word-btn";
      btn.type = "button";
      btn.textContent = "\u{1F50A} " + clip.text;
      btn.dataset.clipId = clip.clip_id;
      btn.addEventListener("click", () => playClip(clip.clip_id, btn));
      row.appendChild(btn);
    }
    frag.appendChild(row);
  }
  return frag;
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  addMessage("user", document.createTextNode(text));

  const placeholder = addMessage("teacher", document.createTextNode("..."));

  debug(`POST /chat "${text}"`);
  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text }),
    });
    debug(`POST /chat -> ${res.status} ${res.statusText}`, res.ok ? "ok" : "err");
    const data = await res.json();
    debug("Response: " + JSON.stringify(data));
    placeholder.textContent = "";
    placeholder.appendChild(renderReply(data));
  } catch (err) {
    debug("Error handling /chat: " + err, "err");
    placeholder.textContent = "Error: " + err;
  }
});
</script>
</body>
</html>
