<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Russian Pronunciation Tutor</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #1a1a1a;
    --bubble-bg: #f0f2f5;
    --accent: #2563eb;
    --border: #d8dde3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181c;
      --fg: #e8eaed;
      --bubble-bg: #24272c;
      --accent: #5b9dff;
      --border: #3a3f46;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    justify-content: center;
  }
  #app {
    width: 100%;
    max-width: 720px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 16px;
  }
  h1 {
    font-size: 1.1rem;
    font-weight: 600;
    margin: 0 0 12px;
  }
  #log {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding-bottom: 12px;
  }
  .msg {
    max-width: 85%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.5;
    word-wrap: break-word;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--accent);
    color: white;
  }
  .msg.teacher {
    align-self: flex-start;
    background: var(--bubble-bg);
  }
  .word-btn {
    display: inline;
    font: inherit;
    color: var(--accent);
    background: none;
    border: none;
    border-bottom: 2px dotted var(--accent);
    padding: 0 1px;
    cursor: pointer;
  }
  .word-btn:hover {
    opacity: 0.75;
  }
  .word-btn.failed {
    color: #e04b4b;
    border-bottom-color: #e04b4b;
  }
  .spinner-label {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-left: 6px;
    font-size: 0.85rem;
    opacity: 0.7;
  }
  .spinner-icon {
    width: 12px;
    height: 12px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  form {
    display: flex;
    gap: 8px;
  }
  #debug {
    margin-top: 10px;
    border-top: 1px solid var(--border);
    padding-top: 8px;
  }
  #debug summary {
    cursor: pointer;
    font-size: 0.85rem;
    color: var(--fg);
    opacity: 0.7;
  }
  #debug-log {
    margin: 8px 0 0;
    max-height: 200px;
    overflow-y: auto;
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    font-size: 0.78rem;
    background: var(--bubble-bg);
    border-radius: 8px;
    padding: 8px;
    white-space: pre-wrap;
    word-break: break-all;
  }
  #debug-log .err { color: #e04b4b; }
  #debug-log .ok { color: #3aa76d; }
  input[type="text"] {
    flex: 1;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--fg);
    font-size: 1rem;
  }
  button[type="submit"] {
    padding: 10px 16px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: white;
    font-size: 1rem;
    cursor: pointer;
  }
</style>
</head>
<body>
<div id="app">
  <h1>Russian Pronunciation Tutor</h1>
  <div id="log"></div>
  <form id="form">
    <input id="input" type="text" placeholder="Ask anything..." autocomplete="off" autofocus>
    <button type="submit">Send</button>
  </form>
  <details id="debug">
    <summary>Debug log</summary>
    <div id="debug-log"></div>
  </details>
</div>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");
const debugLog = document.getElementById("debug-log");

function debug(msg, level = "info") {
  const time = new Date().toLocaleTimeString();
  const line = document.createElement("div");
  if (level !== "info") line.className = level;
  line.textContent = `[${time}] ${msg}`;
  debugLog.appendChild(line);
  debugLog.scrollTop = debugLog.scrollHeight;
  (level === "err" ? console.error : console.log)(msg);
}

window.addEventListener("error", (e) => debug("Uncaught error: " + e.message, "err"));
window.addEventListener("unhandledrejection", (e) => debug("Unhandled rejection: " + e.reason, "err"));

function addMessage(role, node) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.appendChild(node);
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  return div;
}

async function playClip(clipId, btn) {
  debug(`Clicked word -> clip_id "${clipId}"`);
  try {
    const res = await fetch("/audio/" + clipId);
    debug(`GET /audio/${clipId} -> ${res.status} ${res.statusText}`, res.ok ? "ok" : "err");
    if (!res.ok) {
      btn.classList.add("failed");
      btn.title = `Playback failed: HTTP ${res.status} (${res.statusText})`;
      return;
    }
    const blob = await res.blob();
    debug(`Received ${blob.size} bytes, type=${blob.type}`);
    const url = URL.createObjectURL(blob);
    const audio = new Audio(url);
    audio.addEventListener("ended", () => URL.revokeObjectURL(url));
    await audio.play();
    debug(`Playing clip_id "${clipId}"`, "ok");
    btn.classList.remove("failed");
    btn.title = "";
  } catch (err) {
    debug(`Error playing clip_id "${clipId}": ${err}`, "err");
    btn.classList.add("failed");
    btn.title = "Playback failed: " + err;
  }
}

function renderReply(bubble, html) {
  bubble.innerHTML = html;
  bubble.querySelectorAll(".word-btn").forEach((btn) => {
    debug(`Rendering word "${btn.textContent}" -> clip_id "${btn.dataset.clipId}"`);
    btn.addEventListener("click", () => playClip(btn.dataset.clipId, btn));
  });
}

function makeSpinner(label) {
  const span = document.createElement("span");
  span.className = "spinner-label";
  const icon = document.createElement("span");
  icon.className = "spinner-icon";
  const text = document.createElement("span");
  text.textContent = label;
  span.appendChild(icon);
  span.appendChild(text);
  return { el: span, setLabel: (l) => { text.textContent = l; } };
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  addMessage("user", document.createTextNode(text));

  const bubble = addMessage("teacher", document.createTextNode(""));
  const textNode = bubble.firstChild;
  const spinner = makeSpinner("Thinking...");
  bubble.appendChild(spinner.el);

  debug(`POST /chat (stream) "${text}"`);
  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text }),
    });
    debug(`POST /chat -> ${res.status} ${res.statusText}`, res.ok ? "ok" : "err");
    if (!res.ok || !res.body) throw new Error("HTTP " + res.status);

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const parts = buffer.split("\n\n");
      buffer = parts.pop();
      for (const part of parts) {
        if (!part.startsWith("data: ")) continue;
        const event = JSON.parse(part.slice(6));

        if (event.type === "delta") {
          textNode.textContent += event.content;
        } else if (event.type === "text_done") {
          spinner.setLabel("Creating pronunciation audio...");
          debug("Text streaming complete, synthesizing clips...");
        } else if (event.type === "html") {
          debug("Response html: " + event.html);
          renderReply(bubble, event.html);
        }
      }
    }
  } catch (err) {
    debug("Error handling /chat: " + err, "err");
    bubble.textContent = "Error: " + err;
  }
});
</script>
</body>
</html>
